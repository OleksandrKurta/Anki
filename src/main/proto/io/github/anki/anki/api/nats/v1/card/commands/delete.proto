syntax = "proto3";

package io.github.anki.anki.api.nats.v1.card.commands;

option java_multiple_files = true;

message DeleteCardRequest {
  string card_id = 1;
}

message DeleteCardResponse {
  oneof response {
    Success success = 1;
    Failure failure = 2;
  }
}

message Success {}
message Failure {
  string reason = 1;
}