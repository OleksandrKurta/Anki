services:
  mongodb:
    image: 'mongo:7'
    environment:
      - 'MONGO_INITDB_DATABASE=mydatabase'
      - 'MONGO_INITDB_ROOT_PASSWORD=secret'
      - 'MONGO_INITDB_ROOT_USERNAME=root'
    ports:
      - '27017:27017'
    volumes:
      - './mongodbVolume/:/mongodbVolume'

  nats:
    image: nats:2.8.4-alpine
    restart: always
    command: -m 8222 -DV
    ports:
      - "4222:4222"
      - "4223:4222"
      - "8222:8222"
    healthcheck:
      test: nc -vz localhost 4222
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
